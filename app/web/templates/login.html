{% extends "base.html" %}

{% block title %}Login — kindlanki{% endblock %}

{% block content %}
  <h1>Sign in to AnkiWeb</h1>

  {% if reason == "auth_expired" %}
    <p class="notice">Your session expired. Please sign in again.</p>
  {% endif %}

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login" class="form">
    <label class="field">
      <span class="field-label">Username</span>
      <input type="text" name="username" value="{{ username }}" autocomplete="username" required autofocus>
    </label>

    <label class="field">
      <span class="field-label">Password</span>
      <input type="password" name="password" autocomplete="current-password" required>
    </label>

    <div class="actions">
      <button type="submit" class="btn btn-primary">Sign in</button>
    </div>
  </form>
{% endblock %}
