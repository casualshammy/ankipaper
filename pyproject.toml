[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ankipaper"
version = "0.1.0"
description = "Anki client for Kindle built on top of the official AnkiWeb sync protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "AnkiPaper" }]
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.16.2",
    "cryptography>=50.0.2",
    "zstandard>=0.25.0",
    "anki>=26.9.4",
    "redis>=8.1.0",
    "prometheus-client>=0.26.0",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = ["mypy>=2.4.1", "ruff>=0.17.4", "types-psutil>=7.2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
    "fastapi.params.Body",
    "fastapi.params.Cookie",
    "fastapi.params.Depends",
    "fastapi.params.File",
    "fastapi.params.Form",
    "fastapi.params.Header",
    "fastapi.params.Path",
    "fastapi.params.Query",
    "fastapi.params.Security",
]