<div class="remaining-bar">
  <div class="summary">
    <div class="summary-total">
      {{ remaining }}<span class="summary-total-label">remaining</span>
    </div>
    <div class="breakdown">
      <span class="chip{% if card.css_class == 'tag-current-new' %} chip-current{% elif remaining_new == 0 %} chip-empty{% endif %}">new {{ remaining_new }}</span>
      <span class="chip{% if card.css_class == 'tag-current-learning' %} chip-current{% elif remaining_learning == 0 %} chip-empty{% endif %}">learn {{ remaining_learning }}</span>
      <span class="chip{% if card.css_class == 'tag-current-review' %} chip-current{% elif remaining_review == 0 %} chip-empty{% endif %}">review {{ remaining_review }}</span>
    </div>
  </div>
  <div class="flag-toolbar">
    <button type="button"
            class="mark-btn{% if card.is_marked %} mark-btn-on{% endif %}"
            aria-label="{% if card.is_marked %}Unmark{% else %}Mark{% endif %}">
      {% if card.is_marked %}★{% else %}☆{% endif %}
    </button>
    <div class="flag-buttons">
      <button type="button"
              class="flag-btn{% if card.flag == 0 %} flag-btn-on{% endif %}"
              data-flag="0"
              aria-label="No flag">—</button>
      <button type="button"
              class="flag-btn{% if card.flag == 1 %} flag-btn-on{% endif %}"
              data-flag="1"
              aria-label="Red">R</button>
      <button type="button"
              class="flag-btn{% if card.flag == 2 %} flag-btn-on{% endif %}"
              data-flag="2"
              aria-label="Orange">O</button>
      <button type="button"
              class="flag-btn{% if card.flag == 3 %} flag-btn-on{% endif %}"
              data-flag="3"
              aria-label="Green">G</button>
    </div>
  </div>
</div>

<script>
  (function () {
    const bar = document.querySelector(".flag-toolbar");
    const cardId = parseInt("{{ card.card_id }}", 10);
    let marked = "{{ '1' if card.is_marked else '0' }}";
    let flag = "{{ card.flag }}";

    function post(action, body) {
      return fetch(action, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "X-CSRF-Token": "{{ csrf_token(request) }}",
        },
        body: JSON.stringify(Object.assign({ card_id: cardId }, body)),
      });
    }

    const btn = bar.querySelector(".mark-btn");
    btn.addEventListener("click", function () {
      const next = marked === "1" ? "0" : "1";
      const on = next === "1";
      btn.disabled = true;

      post("/set-card-mark", { marked: on })
        .then(function (_res) {
          if (!_res.ok) {
            if (_res.status === 401)
              window.location = "/login";

            return;
          }
          marked = next;
          btn.textContent = on ? "\u2605" : "\u2606";
          btn.classList.toggle("mark-btn-on", on);
          btn.setAttribute("aria-label", on ? "Unmark" : "Mark");
        })
        .finally(function () {
          btn.disabled = false;
        });
    });

    const flagButtons = bar.querySelectorAll(".flag-btn");
    flagButtons.forEach(function (flagBtn) {
      flagBtn.addEventListener("click", function () {
        const val = parseInt(flagBtn.dataset.flag, 10);
        const prev = flag || "0";
        if (String(val) === prev)
          return;

        flagButtons.forEach(function (b) { b.disabled = true; });

        post("/set-card-flag", { flag: val })
          .then(function (_res) {
            if (!_res.ok) {
              if (_res.status === 401)
                window.location = "/login";

              return;
            }

            flagButtons.forEach(function (b) { b.classList.remove("flag-btn-on"); });
            flagBtn.classList.add("flag-btn-on");
            flag = String(val);
          })
          .finally(function () {
            flagButtons.forEach(function (b) { b.disabled = false; });
          });
      });
    });
  })();
</script>
