services:
  ankipaper:
    build:
      context: .
    image: ankipaper:latest
    container_name: ankipaper
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.data:/data
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    # Inherit the image's Python health check (curl is not installed).

  redis:
    image: redis:7-alpine
    container_name: ankipaper-redis
    restart: unless-stopped
    volumes:
      - ./.redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
