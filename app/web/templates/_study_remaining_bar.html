<div class="remaining-bar" id="remaining-bar">
  <div class="summary">
    <div class="summary-total">
      {{ remaining }}<span class="summary-total-label">remaining</span>
    </div>
    <div class="breakdown">
      <span class="chip{% if card.css_class == 'tag-current-new' %} chip-current{% elif remaining_new == 0 %} chip-empty{% endif %}">new {{ remaining_new }}</span>
      <span class="chip{% if card.css_class == 'tag-current-learning' %} chip-current{% elif remaining_learning == 0 %} chip-empty{% endif %}">learn {{ remaining_learning }}</span>
      <span class="chip{% if card.css_class == 'tag-current-review' %} chip-current{% elif remaining_review == 0 %} chip-empty{% endif %}">review {{ remaining_review }}</span>
    </div>
  </div>
  <div class="flag-toolbar">
    <div class="flag-buttons">
      <form method="post" action="/deck/{{ card.deck_id }}/set-card-mark" class="form form-inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <input type="hidden" name="card_id" value="{{ card.card_id }}">
        <input type="hidden" name="back_card" value="{{ 'True' if back_card else 'False' }}">
        <input type="hidden" name="marked" value="{{ 'False' if card.is_marked else 'True' }}">
        <button 
          type="submit" 
          class="flag-btn{% if card.is_marked %} flag-btn-on{% endif %}"
          aria-label="{% if card.is_marked %}Unmark{% else %}Mark{% endif %}">{% if card.is_marked %}★{% else %}☆{% endif %}</button>
      </form>
      <form method="post" action="/deck/{{ card.deck_id }}/set-card-flag" class="form form-inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <input type="hidden" name="card_id" value="{{ card.card_id }}">
        <input type="hidden" name="back_card" value="{{ 'True' if back_card else 'False' }}">
        <input type="hidden" name="flag" value="{{ '0' if card.flag == 1 else '1' }}">
        <button 
          type="submit" 
          class="flag-btn{% if card.flag == 1 %} flag-btn-on{% endif %}"
          aria-label="Red">R</button>
      </form>
      <form method="post" action="/deck/{{ card.deck_id }}/set-card-flag" class="form form-inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <input type="hidden" name="card_id" value="{{ card.card_id }}">
        <input type="hidden" name="back_card" value="{{ 'True' if back_card else 'False' }}">
        <input type="hidden" name="flag" value="{{ '0' if card.flag == 2 else '2' }}">
        <button 
          type="submit" 
          class="flag-btn{% if card.flag == 2 %} flag-btn-on{% endif %}"
          aria-label="Orange">O</button>
      </form>
      <form method="post" action="/deck/{{ card.deck_id }}/set-card-flag" class="form form-inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <input type="hidden" name="card_id" value="{{ card.card_id }}">
        <input type="hidden" name="back_card" value="{{ 'True' if back_card else 'False' }}">
        <input type="hidden" name="flag" value="{{ '0' if card.flag == 3 else '3' }}">
        <button 
          type="submit" 
          class="flag-btn{% if card.flag == 3 %} flag-btn-on{% endif %}"
          aria-label="Green">G</button>
      </form>
    </div>
  </div>
</div>
