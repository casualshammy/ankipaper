{% extends "base.html" %}

{% block title %}Study — kindlanki{% endblock %}

{% block content %}
  <div class="remaining-row">
    <p class="muted remaining">
      Remaining: <strong>{{ remaining }}</strong>
      <span class="muted-breakdown">
        <span class="tag tag-new {{ 'tag-current-new' if card.css_class == 'tag-current-new' else '' }}">new {{ remaining_new }}</span>
        <span class="tag tag-learning {{ 'tag-current-learning' if card.css_class == 'tag-current-learning' else '' }}">learn {{ remaining_learning }}</span>
        <span class="tag tag-review {{ 'tag-current-review' if card.css_class == 'tag-current-review' else '' }}">review {{ remaining_review }}</span>
      </span>
    </p>
    <form method="post" action="/deck/{{ deck_id }}/flag" class="flag-form">
      <input type="hidden" name="card_id" value="{{ card.card_id }}">
      <select id="flag-select" name="flag" class="flag-select" onchange="this.form.submit()" aria-label="Flag">
        <option value="0" {% if card.flag == 0 %}selected{% endif %}>None</option>
        <option value="1" {% if card.flag == 1 %}selected{% endif %}>Red</option>
        <option value="2" {% if card.flag == 2 %}selected{% endif %}>Yellow</option>
        <option value="3" {% if card.flag == 3 %}selected{% endif %}>Green</option>
        <option value="4" {% if card.flag == 4 %}selected{% endif %}>Blue</option>
      </select>
      <noscript><button type="submit" class="btn btn-small">Set</button></noscript>
    </form>
  </div>

  <article class="card">
    {{ card.question_html | safe }}
  </article>

  <div class="actions-split">
    <a class="btn" href="/">Back to decks</a>
    <form method="post" action="/deck/{{ deck_id }}/study" class="form form-inline">
      <input type="hidden" name="card_id" value="{{ card.card_id }}">
      <input type="hidden" name="card_type" value="{{ card.card_type }}">
      <input type="hidden" name="again_interval" value="{{ card.intervals.again if card.intervals else '—' }}">
      <input type="hidden" name="hard_interval" value="{{ card.intervals.hard if card.intervals else '—' }}">
      <input type="hidden" name="good_interval" value="{{ card.intervals.good if card.intervals else '—' }}">
      <input type="hidden" name="easy_interval" value="{{ card.intervals.easy if card.intervals else '—' }}">
      <button type="submit" name="reveal" value="1" class="btn btn-primary">Show answer</button>
    </form>
  </div>
{% endblock %}
