# ---------------------------------------------------------------------------
# Upstream
# ---------------------------------------------------------------------------

upstream kindlanki_app {
    # Option A: nginx on the host, container exposes 127.0.0.1:8000.
    server 127.0.0.1:8000;
    keepalive 32;

    # Option B: nginx in the same docker network, use the service name.
    # Replace with `server kindlanki:8000;` and remove Option A.
}

# ---------------------------------------------------------------------------
# HTTP → HTTPS redirect (with ACME challenge passthrough)
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name kindlanki.example.com;

    # Letsencrypt http-01 challenge — keep this path reachable on :80.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kindlanki.example.com;

    # -----------------------------------------------------------------------
    # SSL/TLS
    # -----------------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/kindlanki.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kindlanki.example.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # -----------------------------------------------------------------------
    # Cloudflare real-IP restoration
    # -----------------------------------------------------------------------
    real_ip_header    CF-Connecting-IP;

    # -----------------------------------------------------------------------
    # Logging
    # -----------------------------------------------------------------------
    access_log /var/log/nginx/kindlanki.access.log;
    error_log  /var/log/nginx/kindlanki.error.log;

    # -----------------------------------------------------------------------
    # Request limits
    # -----------------------------------------------------------------------
    client_max_body_size   1m;
    client_body_timeout    60s;
    client_header_timeout  60s;
    send_timeout           60s;
    keepalive_timeout      75s;

    # -----------------------------------------------------------------------
    # Compression
    # -----------------------------------------------------------------------
    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_types         text/plain
                      text/css
                      text/xml
                      application/json
                      application/javascript
                      application/xml
                      application/xml+rss
                      application/atom+xml
                      image/svg+xml;

    # -----------------------------------------------------------------------
    # Security headers
    # -----------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "interest-cohort=()" always;

    # -----------------------------------------------------------------------
    # Common proxy defaults
    # -----------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Forwarded-Port  $server_port;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_buffering       on;
    proxy_buffers         16 16k;

    # -----------------------------------------------------------------------
    # Locations
    # -----------------------------------------------------------------------

    # Health probe used by `docker healthcheck` and uptime monitors.
    location = /healthz {
        access_log          off;
        proxy_pass          http://kindlanki_app;
        proxy_read_timeout  5s;
        proxy_connect_timeout 5s;
    }

    # Static assets (CSS). The e-ink browser re-fetches rarely.
    location /static/ {
        proxy_pass         http://kindlanki_app;
        proxy_cache_valid  200 7d;
        expires            7d;
        add_header         Cache-Control "public, max-age=604800, immutable";
    }

    # Per-account media files.
    # No caching: filenames can collide between accounts and change
    # after each media-sync.
    location /ms/ {
        proxy_pass       http://kindlanki_app;
        proxy_cache      off;
        proxy_read_timeout 30s;
    }

    # Sync endpoints.
    location ~ ^/sync(/.*)?$ {
        proxy_pass            http://kindlanki_app;
        proxy_cache           off;
        proxy_buffering       off;
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # Login form + POST.
    location = /login {
        proxy_pass         http://kindlanki_app;
        proxy_read_timeout 30s;
    }

    # Everything else.
    location / {
        proxy_pass http://kindlanki_app;
    }
}
