<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}kindlanki{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/eink.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">kindlanki</a>
    <nav class="nav">
      {% block nav %}
        <form method="post" action="/sync" class="nav-form">
          <button type="submit" id="sync-btn" class="btn">Sync</button>
        </form>
        <form method="post" action="/logout" class="nav-form">
          <button type="submit" class="btn">Logout</button>
        </form>
      {% endblock %}
    </nav>
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
