<div class="remaining-bar">
  <div class="summary">
    <div class="summary-total">
      {{ remaining }}<span class="summary-total-label">remaining</span>
    </div>
    <div class="breakdown">
      <span class="chip{% if card.css_class == 'tag-current-new' %} chip-current{% elif remaining_new == 0 %} chip-empty{% endif %}">new {{ remaining_new }}</span>
      <span class="chip{% if card.css_class == 'tag-current-learning' %} chip-current{% elif remaining_learning == 0 %} chip-empty{% endif %}">learn {{ remaining_learning }}</span>
      <span class="chip{% if card.css_class == 'tag-current-review' %} chip-current{% elif remaining_review == 0 %} chip-empty{% endif %}">review {{ remaining_review }}</span>
    </div>
  </div>
  <div class="flag-toolbar">
    <button type="button"
            class="mark-btn{% if card.is_marked %} mark-btn-on{% endif %}"
            aria-label="{% if card.is_marked %}Unmark{% else %}Mark{% endif %}">
      {% if card.is_marked %}★{% else %}☆{% endif %}
    </button>
    <select class="flag-select" aria-label="Flag">
      <option value="0" {% if card.flag == 0 %}selected{% endif %}>—</option>
      <option value="1" {% if card.flag == 1 %}selected{% endif %}>Red ⚑</option>
      <option value="2" {% if card.flag == 2 %}selected{% endif %}>Yellow ⚑</option>
      <option value="3" {% if card.flag == 3 %}selected{% endif %}>Green ⚑</option>
      <option value="4" {% if card.flag == 4 %}selected{% endif %}>Blue ⚑</option>
    </select>
  </div>
</div>

<script>
  (function () {
    const bar = document.querySelector(".flag-toolbar");
    const cardId = parseInt("{{ card.card_id }}", 10);
    let marked = "{{ '1' if card.is_marked else '0' }}";
    let flag = "{{ card.flag }}";

    function post(action, body) {
      return fetch(action, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "X-CSRF-Token": "{{ csrf_token(request) }}",
        },
        body: JSON.stringify(Object.assign({ card_id: cardId }, body)),
      });
    }

    const btn = bar.querySelector(".mark-btn");
    btn.addEventListener("click", async function () {
      btn.disabled = true;
      try {
        const next = marked === "1" ? "0" : "1";
        const on = next === "1";
        const res = await post("/set-card-mark", { marked: on });
        if (!res.ok) {
          if (res.status === 401)
            window.location = "/login";

          return;
        }
        marked = next;
        btn.textContent = on ? "\u2605" : "\u2606";
        btn.classList.toggle("mark-btn-on", on);
        btn.setAttribute("aria-label", on ? "Unmark" : "Mark");
      }
      finally {
        btn.disabled = false;
      }
    });

    var select = bar.querySelector(".flag-select");
    select.addEventListener("change", async function () {
      select.disabled = true;
      try {
        var val = parseInt(select.value, 10);
        var prev = flag || "0";
        const res = await post("/set-card-flag", { flag: val });
        if (!res.ok) {
          select.value = prev;
          if (res.status === 401)
            window.location = "/login";
        }
        else
          flag = String(val);
      }
      catch {
        select.value = prev;
      }
      finally {
        select.disabled = false;
      }
    });
  })();
</script>
